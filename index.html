<!doctype html>
<html lang="es" translate="no">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://ntfy.sh; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; manifest-src 'self'">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07122b">
  <title>United Church</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icono-192.png">
  <link rel="apple-touch-icon" href="assets/icono-192.png">
  <link rel="stylesheet" href="assets/fuentes/fuentes.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-dom" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8 14h3"/></symbol>
    <symbol id="i-bib" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M12 7v6M9.5 9.5h5"/></symbol>
    <symbol id="i-gua" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
    <symbol id="i-cfg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
    <symbol id="i-bus" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-der" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-izq" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
    <symbol id="i-pant" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-est" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-ok" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
    <symbol id="i-luna" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  </defs></svg>
  <aside class="lateral">
    <div class="marca">
      <img src="assets/icono-192.png" alt="" width="52" height="52">
      <div><b>United Church</b><small>International Ministries</small></div>
    </div>
    <nav class="nav">
      <button data-ir="domingo"><svg class="ico"><use href="#i-dom"/></svg>Domingo</button>
      <button data-ir="biblia"><svg class="ico"><use href="#i-bib"/></svg>Biblia</button>
      <button data-ir="guardados"><svg class="ico"><use href="#i-gua"/></svg>Guardados</button>
    </nav>
    <nav class="nav pie-nav">
      <button data-ir="config"><svg class="ico"><use href="#i-cfg"/></svg>Configuración</button>
    </nav>
  </aside>
  <main id="vista" class="principal"></main>
  <dialog id="dlg-fav">
    <form method="dialog" id="f-fav">
      <h3>Guardar <span id="fav-etiqueta"></span></h3>
      <p class="sub">Elige una serie o escribe una nueva</p>
      <div id="fav-series" class="chips"></div>
      <input id="fav-nueva" placeholder="Nueva serie (ej. Bodas)" maxlength="40" aria-label="Nueva serie">
      <div class="acciones acciones-dlg"><button value="ok" class="btn pri">Guardar</button><button value="cancelar" class="btn">Cancelar</button></div>
    </form>
  </dialog>
  <dialog id="dlg-confirmar">
    <h3 id="conf-texto"></h3>
    <div class="acciones acciones-dlg"><button type="button" class="btn pri" id="conf-si"></button><button type="button" class="btn" id="conf-no"></button></div>
  </dialog>
  <dialog id="dlg-sigla">
    <form method="dialog" id="f-sigla">
      <h3>¿Qué sigla le ponemos a esta versión?</h3>
      <p class="sub">Por ejemplo TLA o RVR 1960</p>
      <input id="sigla-campo" maxlength="20" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Sigla de la versión">
      <div class="acciones acciones-dlg"><button value="ok" class="btn pri">Aceptar</button><button value="cancelar" class="btn">Cancelar</button></div>
    </form>
  </dialog>
  <div id="actualizar" class="actualizar" hidden>Hay una versión nueva · <button class="btn pri" id="b-actualizar">Actualizar</button></div>
  <div id="aviso" class="aviso" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
